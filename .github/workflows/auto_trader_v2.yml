name: Auto-Trader (Paper v2 — cap+regime)

# PARALLEL paper experiment. Same momentum screen as the v1 bot, but with the
# backtested combined change: more capital deployed (8 x 12%), a QQQ-100d
# market-regime filter (only enter when risk-on), and the flat $25 daily-loss
# cap replaced by a 3%-of-equity cap so the bigger positions aren't choked.
#
# Isolated from the live bot: writes to a SEPARATE Supabase row (paper_v2),
# starts fresh at $10k, and never touches the v1 'paper' account. Paper only —
# no Webull credentials, so it can only ever simulate.

on:
  # PAUSED: the schedule is removed so v2 no longer runs on its own. To resume,
  # restore this block:
  #   schedule:
  #     - cron: '15,45 13-20 * * 1-5'
  workflow_dispatch:
    inputs:
      report:
        description: 'Print the trade journal instead of trading'
        type: boolean
        default: false
      audit:
        description: 'Read-only account audit instead of trading'
        type: boolean
        default: false
      repair_journal:
        description: 'Add missing journal entries from the trade log (journal only)'
        type: boolean
        default: false
      sell_symbol:
        description: 'Sell this paper position now (market hours only), instead of trading'
        type: string
        default: ''

jobs:
  paper-trade-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas anthropic supabase python-dotenv requests

      - name: Run one paper cycle (v2)
        env:
          AUTO_TRADE_MODE: paper
          AUTO_TRADE_STATE_ID: paper_v2          # separate account from the live bot
          # Same screen as v1:
          AUTO_TRADE_USE_AI: 'false'
          AUTO_TRADE_MIN_CHANGE: '0.5'
          AUTO_TRADE_MIN_VOL_SPIKE: '1.0'
          AUTO_TRADE_MIN_RSI: '45'
          AUTO_TRADE_MAX_RSI: '80'
          # #1 deploy more capital (backtest: raising the cap only helps WITH the regime filter):
          AUTO_TRADE_MAX_POSITIONS: '8'
          AUTO_TRADE_POSITION_PCT: '0.12'
          # Replace the flat $25 daily cap (doesn't scale with bigger positions) with 3% of equity:
          AUTO_TRADE_DAILY_LOSS_USD: '0'
          AUTO_TRADE_DAILY_LOSS_PCT: '0.03'
          # #2 market-regime filter: only enter when QQQ is above its 100-day SMA:
          AUTO_TRADE_REGIME_FILTER: 'true'
          AUTO_TRADE_REGIME_SYMBOL: 'QQQ'
          AUTO_TRADE_REGIME_MA: '100'
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
          SELL_SYMBOL:   ${{ github.event.inputs.sell_symbol }}
        run: |
          if [ -n "$SELL_SYMBOL" ]; then
            python auto_trader.py --sell "$SELL_SYMBOL"
          elif [ "${{ github.event.inputs.repair_journal }}" = "true" ]; then
            python auto_trader.py --repair-journal
          elif [ "${{ github.event.inputs.audit }}" = "true" ]; then
            python auto_trader.py --audit
          elif [ "${{ github.event.inputs.report }}" = "true" ]; then
            python auto_trader.py --journal
          else
            timeout 300 python auto_trader.py --once || true
          fi
