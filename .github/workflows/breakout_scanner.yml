name: Breakout Scanner

# Weekday breakout alerts to their own Telegram bot. Read-only.
#   Morning (~8:15 CT): WATCH list of stocks about to break out.
#   Every 30 min while the market is open: TRIGGERED alerts for new breakouts.
# GitHub cron is UTC; this covers both CDT and CST and the script decides
# from the Central-time clock what (if anything) to send.

on:
  push:
    branches: [breakout-scanner]  # TEMP test
  schedule:
    - cron: '15,45 13-21 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'What to run now'
        type: choice
        options: [both, watch, trigger]
        default: both
      dry_run:
        description: 'Print the messages instead of sending them'
        type: boolean
        default: true

concurrency:
  group: breakout-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pandas numpy yfinance
      # Remembers what was already sent today, so nothing is alerted twice.
      - uses: actions/cache/restore@v4
        with:
          path: breakout_state.json
          key: breakout-state-${{ github.run_id }}
          restore-keys: breakout-state-
      - name: Scan and alert
        env:
          FMP_KEY: ${{ secrets.FMP_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.BREAKOUT_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.BREAKOUT_TELEGRAM_CHAT_ID }}
          STATE_FILE: breakout_state.json
          FORCE: ${{ github.event_name == 'push' && 'both' || (github.event_name == 'workflow_dispatch' && inputs.force || '') }}
          DRY_RUN: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)) && '1' || '0' }}
        run: python breakout_scanner.py
      - if: github.event_name == 'schedule'
        uses: actions/cache/save@v4
        with:
          path: breakout_state.json
          key: breakout-state-${{ github.run_id }}
