name: Stock Alert Monitor

on:
  schedule:
    - cron: '*/5 * * * 1-5'
    - cron: '0 13 * * 1-5'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pytz supabase python-dotenv

      - name: Run alert monitor
        env:
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:       ${{ secrets.SUPABASE_KEY }}
          FMP_KEY:            ${{ secrets.FMP_KEY }}
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SEND_BRIEF:         ${{ github.event.schedule == '0 13 * * 1-5' && 'true' || 'false' }}
        run: |
          timeout 240 python alert_monitor.py || true
